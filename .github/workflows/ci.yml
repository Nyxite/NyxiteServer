name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      # Unit tests include the shared conformance vectors: a wire-format regression fails the build.
      - run: dotnet run -c Release --no-build --project tests/Nyxite.UnitTests
      - run: dotnet run -c Release --no-build --project tests/Nyxite.CrdtConformanceTests
      # Integration tests start their own Postgres through Testcontainers.
      - run: dotnet run -c Release --no-build --project tests/Nyxite.IntegrationTests

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
